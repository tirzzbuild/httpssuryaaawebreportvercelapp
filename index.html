<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Email Report</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .container {
    background:white; border-radius:16px; padding:45px 40px;
    width:100%; max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  h2 { color:#333; margin-bottom:8px; text-align:center; font-size:1.6rem; }
  .subtitle { text-align:center; color:#888; margin-bottom:30px; font-size:0.9rem; }

  label { display:block; color:#555; font-size:0.9rem; margin-bottom:6px; font-weight:500; }
  input {
    width:100%; padding:13px 15px;
    border:1.5px solid #e2e5ee; border-radius:10px;
    font-size:0.95rem; outline:none; margin-bottom:18px;
    transition:0.2s; background:#fafbff; font-family:inherit;
  }
  input:focus {
    border-color:#667eea; background:white;
    box-shadow:0 0 0 3px rgba(102,126,234,0.15);
  }
  button {
    width:100%; padding:14px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white; border:none; border-radius:10px;
    font-size:1rem; font-weight:600; cursor:pointer;
    transition:0.3s;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(102,126,234,0.4); }
  button:active { transform:translateY(0); }

  .error {
    background:#fee; color:#c33; padding:12px;
    border-radius:10px; margin-bottom:18px;
    font-size:0.88rem; text-align:center;
    border-left:4px solid #e74c3c;
  }
  .hidden { display:none; }

  .logo {
    text-align:center; font-size:3rem; margin-bottom:10px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🔐</div>
  <h2>Login</h2>
  <p class="subtitle">Masuk untuk mengakses dashboard</p>

  <div id="loginError" class="error hidden"></div>

  <label>Username</label>
  <input type="text" id="username" placeholder="Masukkan username" autocomplete="off">

  <label>Password</label>
  <input type="password" id="password" placeholder="Masukkan password">

  <button onclick="login()">Masuk →</button>
</div>

<script>
  /* ============ KREDENSIAL LOGIN ============ */
  const LOGIN_USERNAME = "surya";
  const LOGIN_PASSWORD = "ganteng";

  function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('loginError');

    if (u === LOGIN_USERNAME && p === LOGIN_PASSWORD) {
      err.classList.add('hidden');
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('userName', u);
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = "❌ Username atau password salah!";
      err.classList.remove('hidden');
      document.getElementById('password').value = '';
    }
  }

  /* Enter untuk submit */
  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });
  document.getElementById('username').addEventListener('keypress', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  /* Kalau sudah login, langsung ke dashboard */
  if (sessionStorage.getItem('isLoggedIn') === 'true') {
    window.location.href = 'dashboard.html';
  }
</script>

</body>
</html>
